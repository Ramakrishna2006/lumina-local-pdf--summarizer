<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Lumina – private, local AI that summarizes and answers questions about your documents" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lumina · Local Document AI</title>
    <script>
      // Apply the saved theme before React loads (prevents a flash of the wrong theme).
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("lm.theme")) || "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
